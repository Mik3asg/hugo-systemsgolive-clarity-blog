{{/* Shared styles for the Services page (layouts/_default/services.html) and the archived consulting page (layouts/_default/consulting.html). */}}
<style>
.consulting {
  --consulting-card-shadow: rgba(0, 0, 0, 0.12);
}
html[data-mode="dim"] .consulting {
  --consulting-card-shadow: rgba(255, 255, 255, 0.08);
}
@media (prefers-color-scheme: dark) {
  html:not([data-mode="lit"]) .consulting {
    --consulting-card-shadow: rgba(255, 255, 255, 0.08);
  }
}
.consulting-hero {
  max-width: 42rem;
  margin: 0 auto 4rem;
  text-align: center;
}
.consulting-eyebrow {
  margin: 0 0 0.75rem;
  font-size: 0.9rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--theme);
}
.consulting-hero-title {
  margin: 0 0 1rem;
  font-size: 2.5rem;
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -0.03em;
  color: var(--header-text);
}
.consulting-hero-sub {
  margin: 0 auto 1.75rem;
  max-width: 34rem;
  font-size: 1.1rem;
  line-height: 1.6;
  color: var(--text);
}
.consulting-hero-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.75rem;
  margin-bottom: 2.5rem;
}
.consulting-cta {
  text-transform: none;
  font-weight: 700;
  padding: 0.75rem 1.75rem;
}
.consulting-section-title {
  margin: 0 0 1rem;
  font-size: 1.85rem;
  font-weight: 800;
  line-height: 1.2;
  letter-spacing: -0.025em;
  color: var(--header-text);
}
.consulting-section {
  margin-top: 5rem;
  padding-top: 3.5rem;
  border-top: 1px solid var(--table-border);
}
.consulting-problems {
  padding: 3rem 2rem 3.5rem;
  border-top: none;
  border-radius: 20px;
  background: var(--post-bg);
}
.consulting-problems-intro {
  margin: 0 0 1.75rem;
  color: var(--text);
}
.consulting-problem-list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.25rem;
}
.consulting-problem-card {
  padding: 1.75rem 1.5rem;
  border: 1px solid var(--table-border);
  border-radius: 10px;
  background: var(--choice-bg);
  box-shadow: 0 0.25rem 0.75rem var(--consulting-card-shadow);
  transition: border-color 0.2s var(--ease), transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
}
.consulting-problem-card:hover {
  border-color: var(--theme);
  transform: translateY(-2px);
  box-shadow: 0 0.75rem 1.75rem var(--consulting-card-shadow);
}
.consulting-problem-icon {
  display: inline-flex;
  margin-bottom: 0.9rem;
  color: var(--theme);
}
.consulting-problem-icon svg {
  width: 26px;
  height: 26px;
}
.consulting-problem-card h3 {
  margin: 0 0 0.4rem;
  font-size: 1.1rem;
  font-weight: 800;
  line-height: 1.3;
  letter-spacing: -0.015em;
  color: var(--header-text);
}
.consulting-problem-card p {
  margin: 0;
  color: var(--text);
  line-height: 1.55;
  font-size: 0.95rem;
}
.consulting-proof {
  padding: 3rem 2rem 3.5rem;
  border-top: none;
  border-radius: 20px;
  background: var(--post-bg);
}
.consulting-proof-intro {
  margin: 0 0 1.75rem;
  color: var(--text);
  line-height: 1.7;
}
.consulting-proof-metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.25rem;
}
.consulting-metric {
  padding: 1.75rem 1.5rem;
  border: 1px solid var(--table-border);
  border-radius: 10px;
  background: var(--choice-bg);
  box-shadow: 0 0.25rem 0.75rem var(--consulting-card-shadow);
  text-align: center;
}
.consulting-metric-value {
  font-size: 1.85rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--theme);
  line-height: 1.15;
}
.consulting-metric-label {
  margin-top: 0.4rem;
  font-size: 1rem;
  color: var(--text);
}
.consulting-process {
  padding: 3rem 2rem 3.5rem;
  border-top: none;
  border-radius: 20px;
  background: var(--post-bg);
}
.consulting-process-intro {
  margin: -1rem 0 2rem;
  color: var(--text);
  line-height: 1.6;
}
.consulting-process-steps {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.25rem;
}
.consulting-process-step {
  padding: 1.5rem;
  border: 1px solid var(--table-border);
  border-radius: 8px;
  background: var(--choice-bg);
  box-shadow: 0 0.25rem 0.75rem var(--consulting-card-shadow);
  transition: border-color 0.2s var(--ease), transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
}
.consulting-process-step:hover {
  border-color: var(--theme);
  transform: translateY(-2px);
  box-shadow: 0 0.75rem 1.75rem var(--consulting-card-shadow);
}
.consulting-process-header {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  margin-bottom: 0.5rem;
}
.consulting-process-number {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  border-radius: 6px;
  background: transparent;
  border: 1px solid var(--theme);
  color: var(--theme);
  font-size: 0.85rem;
  font-weight: 700;
}
.consulting-process-header h3 {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--theme);
}
.consulting-process-step p {
  margin: 0;
  color: var(--text);
  line-height: 1.6;
}
.consulting-final-cta {
  text-align: center;
  padding: 3.5rem 2rem;
  border-top: none;
  border-radius: 20px;
  background: var(--theme);
}
.consulting-final-cta .consulting-eyebrow {
  color: var(--light);
  opacity: 0.85;
}
.consulting-final-cta .consulting-section-title {
  margin-bottom: 0.75rem;
  color: var(--light);
}
.consulting-final-cta p:not(.consulting-eyebrow) {
  margin: 0 auto 1.75rem;
  max-width: 34rem;
  color: var(--light);
  opacity: 0.9;
  line-height: 1.6;
}
.consulting-final-cta .button {
  background-color: var(--light);
  color: var(--theme);
  border-color: var(--light);
}
.consulting-final-cta .button:hover,
.consulting-final-cta .button:focus {
  opacity: 0.88;
}
@media (max-width: 64rem) {
  .consulting-problem-list {
    grid-template-columns: repeat(2, 1fr);
  }
}
@media (max-width: 42rem) {
  .consulting-hero-title {
    font-size: 1.75rem;
  }
  .consulting-problems,
  .consulting-proof,
  .consulting-process,
  .consulting-final-cta {
    padding: 2.25rem 1.25rem 2.5rem;
    border-radius: 14px;
  }
  .consulting-problem-list {
    grid-template-columns: 1fr;
  }
  .consulting-proof-metrics {
    grid-template-columns: 1fr;
  }
  .consulting-process-steps {
    grid-template-columns: 1fr;
  }
}
</style>
