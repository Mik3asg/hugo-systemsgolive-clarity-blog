{{- $s := .Site.Params }}
{{- $c := default .Site.Title .Site.Copyright  }}
{{- if or .Params.enableMathNotation $s.enableMathNotation }}
  {{ partialCached "math" . }}
{{- end }}

<!-- ORIGINAL FOOTER - COMMENTED OUT FOR BACKUP
{{- $iconsDir := default "icons/" .Site.Params.iconsDir }}
{{- $defaultFooterLogo := printf "%s%s" $iconsDir "apple-touch-icon.png"}}
<footer class="footer">
  <div class="footer_inner wrap pale">
    <img src='{{ absURL (default $defaultFooterLogo $s.footerLogo) }}' class="icon icon_2 transparent" alt="{{ $c }}">
    <p>{{ $c }}</p>
    {{- partialCached "top" .}}
  </div>
</footer>
END ORIGINAL FOOTER -->

<!-- NEW CUSTOM FOOTER -->
<footer class="footer">
  <div class="footer_inner wrap pale footer_inner_custom">
    <p style="white-space: nowrap; margin: 0;">{{ $c }}</p>
    {{- partialCached "top" .}}
  </div>
</footer>
<style>
.footer_inner_custom {
  display: flex !important;
  align-items: center;
  justify-content: flex-start;
  gap: 1rem;
  flex-wrap: wrap;
}
</style><script>
/* GA4 conversion events: enquiry and booking intent. No-op if gtag is not loaded. */
document.addEventListener('click', function (e) {
  if (typeof gtag !== 'function') return;
  var a = e.target.closest && e.target.closest('a[href]');
  if (!a) return;
  var href = a.getAttribute('href');
  var params = { link_text: (a.textContent || '').trim(), page_path: location.pathname };
  if (href.indexOf('cal.com/') !== -1) gtag('event', 'book_call_click', params);
  else if (href.indexOf('mailto:') === 0) gtag('event', 'email_click', params);
  else if (/^\/contact\/?(#.*)?$/.test(href)) gtag('event', 'contact_cta_click', params);
});
</script>
