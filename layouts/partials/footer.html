{{- $s := .Site.Params }}
{{- $c := default .Site.Title .Site.Copyright  }}
{{- if or .Params.enableMathNotation $s.enableMathNotation }}
  {{ partialCached "math" . }}
{{- end }}

<!-- ORIGINAL FOOTER - COMMENTED OUT FOR BACKUP
{{- $iconsDir := default "icons/" .Site.Params.iconsDir }}
{{- $defaultFooterLogo := printf "%s%s" $iconsDir "apple-touch-icon.png"}}
<footer class="footer">
  <div class="footer_inner wrap pale">
    <img src='{{ absURL (default $defaultFooterLogo $s.footerLogo) }}' class="icon icon_2 transparent" alt="{{ $c }}">
    <p>{{ $c }}</p>
    {{- partialCached "top" .}}
  </div>
</footer>
END ORIGINAL FOOTER -->

<!-- NEW CUSTOM FOOTER -->
<footer class="footer">
  <div class="footer_inner wrap pale footer_inner_custom">
    <p style="white-space: nowrap; margin: 0;">{{ $c }} · <a href="{{ absLangURL "timeline/" }}" class="footer_archive_link">Full Archive</a></p>
    {{- partialCached "top" .}}
  </div>
</footer>
<style>
.footer_inner_custom {
  display: flex !important;
  align-items: center;
  justify-content: flex-start;
  gap: 1rem;
  flex-wrap: wrap;
}
.footer_archive_link {
  color: var(--text);
  font-size: 0.9rem;
  text-decoration: underline;
}
.footer_archive_link:hover {
  color: var(--theme);
}
</style>
