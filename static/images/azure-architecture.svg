<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" width="1120" height="740" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="740" rx="12" fill="#ffffff"/>

  <!-- ===== Azure region ===== -->
  <rect x="490" y="20" width="615" height="540" rx="12" fill="#eff6ff" stroke="#0078D4" stroke-width="2"/>
  <text x="510" y="46" font-size="15" font-weight="700" fill="#005a9e">Azure UK South – VNet</text>
  <text x="1085" y="46" text-anchor="end" font-size="11" fill="#374151">Built with Bicep · configured with Ansible</text>

  <!-- App tier subnet -->
  <rect x="510" y="60" width="575" height="210" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-dasharray="5 4"/>
  <text x="526" y="82" font-size="12" font-weight="600" fill="#1e40af">App tier subnet – across availability zones</text>
  <g font-size="12" font-weight="600" fill="#111827" text-anchor="middle">
    <rect x="526" y="96" width="127" height="56" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="589.5" y="129">Tomcat VM 1</text>
    <rect x="665" y="96" width="127" height="56" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="728.5" y="129">Tomcat VM 2</text>
    <rect x="804" y="96" width="127" height="56" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="867.5" y="129">Tomcat VM 3</text>
    <rect x="943" y="96" width="127" height="56" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="1006.5" y="129">Tomcat VM 4</text>
  </g>
  <text x="798" y="178" text-anchor="middle" font-size="11.5" fill="#1f2937">Each VM: Apache (Let's Encrypt wildcard cert) → Tomcat · OpenLDAP replicated</text>
  <rect x="526" y="196" width="254" height="54" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="653" y="218" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Jump VM</text>
  <text x="653" y="236" text-anchor="middle" font-size="11" fill="#374151">SSH port forwarding to MySQL &amp; Redis</text>
  <rect x="810" y="196" width="260" height="54" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="940" y="218" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Shared services VM</text>
  <text x="940" y="236" text-anchor="middle" font-size="11" fill="#374151">Common app services</text>


  <!-- App -> Data / Redis -->
  <line x1="815" y1="270" x2="815" y2="316" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="977" y1="270" x2="977" y2="316" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(0,-60)">
  <!-- Data tier subnet -->
  <rect x="510" y="380" width="340" height="140" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-dasharray="5 4"/>
  <text x="526" y="402" font-size="12" font-weight="600" fill="#1e40af">Data tier subnet – private only</text>
  <g fill="#bfdbfe" stroke="#2563eb" stroke-width="1.2">
    <path d="M563,420 v34 a17,6 0 0 0 34,0 v-34"/><ellipse cx="580" cy="420" rx="17" ry="6"/>
    <path d="M613,420 v34 a17,6 0 0 0 34,0 v-34"/><ellipse cx="630" cy="420" rx="17" ry="6"/>
    <path d="M663,420 v34 a17,6 0 0 0 34,0 v-34"/><ellipse cx="680" cy="420" rx="17" ry="6"/>
    <path d="M713,420 v34 a17,6 0 0 0 34,0 v-34"/><ellipse cx="730" cy="420" rx="17" ry="6"/>
    <path d="M763,420 v34 a17,6 0 0 0 34,0 v-34"/><ellipse cx="780" cy="420" rx="17" ry="6"/>
  </g>
  <text x="680" y="483" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Azure Database for MySQL</text>
  <text x="680" y="500" text-anchor="middle" font-size="11" fill="#374151">Flexible Server × 5 · HA</text>

  <!-- Redis -->
  <rect x="870" y="380" width="215" height="140" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-dasharray="5 4"/>
  <text x="886" y="402" font-size="12" font-weight="600" fill="#1e40af">Cache subnet</text>
  <rect x="890" y="418" width="175" height="56" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="977" y="442" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Azure Managed Redis</text>
  <text x="977" y="460" text-anchor="middle" font-size="11" fill="#374151">HA</text>
  <text x="977" y="500" text-anchor="middle" font-size="11" fill="#374151">Private endpoint only</text>

  <!-- Backup & monitoring -->
  <rect x="510" y="536" width="285" height="70" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="526" y="557" font-size="12" font-weight="700" fill="#065f46">Backups</text>
  <text x="526" y="576" font-size="11" fill="#1f2937">MySQL: geo-redundant backups</text>
  <text x="526" y="594" font-size="11" fill="#1f2937">VMs: Recovery Services vault</text>
  <rect x="810" y="536" width="275" height="70" rx="8" fill="#fefce8" stroke="#ca8a04"/>
  <text x="826" y="557" font-size="12" font-weight="700" fill="#854d0e">Monitoring</text>
  <text x="826" y="576" font-size="11" fill="#1f2937">Azure Monitor: VMs &amp; databases</text>
  <text x="826" y="594" font-size="11" fill="#1f2937">Application Insights: app-level telemetry</text>

  <!-- S2S VPN + previous provider -->
  <line x1="800" y1="620" x2="800" y2="670" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="812" y="640" font-size="11" font-weight="600" fill="#374151">Site-to-site VPN</text>
  <text x="812" y="655" font-size="11" fill="#4b5563">Azure DMS traffic during migration</text>
  <rect x="490" y="674" width="615" height="86" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="510" y="700" font-size="14" font-weight="700" fill="#374151">Previous hosting provider</text>
  <text x="510" y="722" font-size="12" fill="#1f2937">• Self-hosted MySQL – source for Azure DMS (migration only)</text>
  <text x="510" y="742" font-size="12" fill="#1f2937">• A few integration services kept on purpose</text>

  </g>

  <!-- ===== Bitbucket ===== -->
  <rect x="15" y="30" width="180" height="70" rx="10" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="105" y="60" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Bitbucket Pipelines</text>
  <text x="105" y="80" text-anchor="middle" font-size="12" fill="#4b5563">CI/CD</text>
  <line x1="195" y1="65" x2="507" y2="65" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="215" y="57" font-size="11" fill="#374151">Build &amp; deploy WAR over SSH</text>

  <!-- ===== Users ===== -->
  <rect x="15" y="250" width="148" height="90" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="89" y="288" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Users</text>
  <text x="89" y="310" text-anchor="middle" font-size="12" fill="#4b5563">Web &amp; mobile</text>
  <line x1="163" y1="295" x2="211" y2="295" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="187" y="285" text-anchor="middle" font-size="11" fill="#374151">HTTPS</text>

  <!-- ===== Cloudflare ===== -->
  <rect x="215" y="170" width="180" height="270" rx="10" fill="#fff7ed" stroke="#F38020" stroke-width="2"/>
  <text x="305" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#c2410c">Cloudflare</text>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <rect x="232" y="215" width="146" height="38" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="305" y="239">DNS + edge TLS cert</text>
    <rect x="232" y="263" width="146" height="38" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="305" y="287">WAF rules</text>
    <rect x="232" y="311" width="146" height="38" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="305" y="335">Load balancer</text>
    <rect x="232" y="359" width="146" height="38" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="305" y="383">Health checks</text>
  </g>
  <text x="305" y="425" text-anchor="middle" font-size="11" fill="#9a3412">No Azure Load Balancer</text>
  <path d="M395,230 H415 V124 H523" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="330" y="160" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Full (strict) TLS to origin</text>
  
  <!-- ===== Ops team ===== -->
  <rect x="15" y="460" width="180" height="90" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="105" y="498" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Ops team</text>
  <text x="105" y="518" text-anchor="middle" font-size="12" fill="#4b5563">DevOps &amp; support</text>
  <path d="M195,490 H440 V142 H523" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#arrg)"/>
  <text x="210" y="482" font-size="11" font-weight="600" fill="#047857">SSH to Tomcat VMs via Cisco VPN</text>
  <path d="M195,530 H465 V223 H523" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrp)"/>
  <text x="210" y="548" font-size="11" font-weight="600" fill="#6d28d9">Workbench / Redis client via Cisco VPN → Jump VM</text>

  <!-- ===== TLS legend ===== -->
  <rect x="15" y="600" width="440" height="125" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="33" y="626" font-size="13" font-weight="700" fill="#111827">TLS end to end</text>
  <text x="33" y="650" font-size="12" fill="#1f2937">1. User → Cloudflare: Cloudflare edge certificate</text>
  <text x="33" y="672" font-size="12" fill="#1f2937">2. Cloudflare → Apache: Let's Encrypt wildcard cert</text>
  <text x="33" y="694" font-size="12" fill="#1f2937">3. SSL mode Full (strict): Cloudflare only accepts a valid,</text>
  <text x="49" y="712" font-size="12" fill="#1f2937">unexpired origin cert matching the hostname</text>
</svg>
