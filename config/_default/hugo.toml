# set `baseurl` to your root domain
# if you set it to "/" share icons won't work properly on production

#baseurl = "https://whimsical-muffin-b06fa5.netlify.app/"  # Updated to your Netlify URL
baseurl = "https://systemsgolive.com/"  # Updated to your Netlify URL

title = "SystemsGoLive"  # Edit directly from config/_default/languages.toml # alternatively, uncomment this and remove `title` entry from the aforemention file.

#copyright = "Copyright © 2008–2018, Steve Francia and the Hugo Authors; all rights reserved."
copyright = "© 2026 SystemsGoLive. All rights reserved."

# canonifyurls = true

theme = "hugo-clarity"
enableRobotsTXT = true  # served from layouts/robots.txt
disqusShortname = ""
DefaultContentLanguage = "en"
locale = "en-us"  # replaces the deprecated languageCode key (Hugo v0.158.0+)

# [languages]
# config/_default/languages.toml

# [menus]
# config/_default/menus/menu.xx.toml

[taxonomies]  
category = "categories"
tag = "tags"
#series = "series"

[outputs]
home = ["HTML", "RSS", "JSON"]

[pagination]
  pagerSize = 10

# Also expose static/images to Hugo's asset pipeline so list thumbnails can be resized.
# Declaring mounts replaces the defaults, so assets/ and static/ are listed explicitly.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"

# Related articles at the end of each post: match on shared tags and categories, ignoring case.
[related]
  includeNewer = true
  threshold = 20
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 80
