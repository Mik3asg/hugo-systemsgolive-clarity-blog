[build]
publish = "public"
command = """
    git submodule update --init --recursive
    hugo --minify
"""

[build.environment]
HUGO_VERSION = "0.139.0"
GO_VERSION = "1.23.4"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.production.environment]
HUGO_ENV = "production"

[context.split1]
command = "hugo --enableGitInfo"

[context.deploy-preview]
command = "hugo --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
command = "hugo --buildFuture -b $DEPLOY_PRIME_URL"
# The former Portuguese site (/pt/) was removed; send old URLs to the English equivalents.
[[redirects]]
  from = "/pt/categories/*"
  to = "/categories/"
  status = 301
  force = true

[[redirects]]
  from = "/pt/tags/*"
  to = "/tags/"
  status = 301
  force = true

[[redirects]]
  from = "/pt/index.xml"
  to = "/index.xml"
  status = 301
  force = true

[[redirects]]
  from = "/pt/sitemap.xml"
  to = "/sitemap.xml"
  status = 301
  force = true

[[redirects]]
  from = "/pt/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pt"
  to = "/"
  status = 301
  force = true

# Hugo no longer writes a per-language sitemap; /en/js/ assets must stay reachable.
[[redirects]]
  from = "/en/sitemap.xml"
  to = "/sitemap.xml"
  status = 301
  force = true
